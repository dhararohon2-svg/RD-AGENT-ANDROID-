name: AntiGem Android Build & Test

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'agy_ide_bridge/**'
      - 'scripts/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'version.json'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Go for Android ARM64 bridge
        uses: actions/setup-go@v5
        with:
          go-version-file: agy_ide_bridge/go.mod
          cache-dependency-path: agy_ide_bridge/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install required packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify wrapper and scripts
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./gradlew --version
          go version

      - name: Test Android ARM64 bridge packages
        working-directory: agy_ide_bridge
        env:
          GOTOOLCHAIN: local
        run: go test ./...

      - name: Run JVM unit tests
        run: ./gradlew :app:testTermuxDebugUnitTest --no-daemon --stacktrace

      - name: Build standalone Android APK
        run: ./gradlew :app:assembleTermuxDebug --no-daemon --stacktrace

      - name: Verify APK exists and report size
        run: |
          APK=$(find app/build/outputs/apk/termux/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK" && test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload installable debug APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AntiGem-Android-Debug-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/apk/termux/debug/*.apk
            app/build/reports/tests/testTermuxDebugUnitTest/**
            app/build/test-results/testTermuxDebugUnitTest/**
